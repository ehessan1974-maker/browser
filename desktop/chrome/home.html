<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>برق • البداية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #12241d 0%, #0c1210 60%);
    color: #e7f0ec; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; padding: 24px;
  }
  .mark {
    width: 76px; height: 76px; border-radius: 22px;
    display: grid; place-items: center; font-size: 38px;
    border: 1px solid rgba(52,211,153,.3);
    background: rgba(52,211,153,.08);
    box-shadow: 0 0 60px rgba(52,211,153,.12);
  }
  h1 { font-size: 30px; font-weight: 800; }
  h1 span { color: #34d399; }
  .tag { color: #93a8a0; font-size: 14px; margin-top: -12px; }
  form { width: min(620px, 92vw); }
  form .row { display: flex; gap: 8px; }
  form .row input { flex: 1; }
  input {
    width: 100%; height: 52px; border-radius: 26px;
    border: 1px solid rgba(255,255,255,.12); outline: none;
    background: rgba(0,0,0,.4); color: #e7f0ec;
    padding: 0 24px; font-size: 15px; direction: ltr; text-align: left;
  }
  input:focus { border-color: rgba(52,211,153,.6); box-shadow: 0 0 0 3px rgba(52,211,153,.14); }
  .engines { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .engines .lbl { color: #6f877e; font-size: 12px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chips button {
    padding: 7px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
    color: #cfe0d9; font-size: 13px; font-family: inherit;
    transition: background .06s, color .06s, border-color .06s, transform .05s;
  }
  .chips button:hover { border-color: rgba(52,211,153,.45); color: #34d399; }
  /* 1.2.4 — إحساس الضغط الفعلي على كل الأزرار */
  .chips button:active {
    transform: translateY(1px) scale(.94);
    background: rgba(52,211,153,.32); border-color: rgba(52,211,153,.75);
    color: #eafff6;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.5);
  }
  .chips button.on {
    background: rgba(52,211,153,.16); border-color: rgba(52,211,153,.55);
    color: #34d399; font-weight: 700;
  }
  .tiles { display: grid; grid-template-columns: repeat(4, 88px); gap: 12px; }
  a.tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 6px 10px; border-radius: 16px; text-decoration: none;
    border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03);
    color: #cfe0d9; font-size: 12px; transition: .15s;
  }
  a.tile:hover { border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); transform: translateY(-2px); }
  a.tile:active { transform: translateY(0) scale(.95); background: rgba(52,211,153,.18); border-color: rgba(52,211,153,.6); }
  .tile i {
    font-style: normal; font-size: 22px;
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center; background: rgba(52,211,153,.1);
  }
  .note { color: #6f877e; font-size: 12px; }
  .note b { color: #34d399; }
  @media (max-width: 640px) {
    .tiles { grid-template-columns: repeat(4, 74px); }
    .chips button { padding: 6px 12px; font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="mark">⚡</div>
  <h1>بـ<span>ر</span>ق</h1>
  <p class="tag">تصفّح أسرع — أخفّ — أكثر خصوصية</p>

  <form id="s">
    <div class="row">
      <input id="q" type="text" spellcheck="false" placeholder="ابحث في الإنترنت أو اكتب عنوانًا…" aria-label="البحث" />
    </div>
  </form>

  <div class="engines">
    <span class="lbl">محرك البحث الافتراضي — اضغط على الاسم للتغيير</span>
    <div class="chips" id="chips"></div>
  </div>

  <div class="tiles">
    <a class="tile" href="https://www.google.com"><i>🔎</i>جوجل</a>
    <a class="tile" href="https://ar.wikipedia.org"><i>📚</i>ويكيبيديا</a>
    <a class="tile" href="https://www.youtube.com"><i>▶️</i>يوتيوب</a>
    <a class="tile" href="https://www.aljazeera.net"><i>📰</i>الجزيرة</a>
    <a class="tile" href="https://x.com"><i>𝕏</i>إكس</a>
    <a class="tile" href="https://www.facebook.com"><i>👥</i>فيسبوك</a>
    <a class="tile" href="https://duckduckgo.com"><i>🦆</i>دك دك جو</a>
    <a class="tile" href="https://www.bing.com"><i>🅑</i>بينج</a>
  </div>

  <p class="note">🛡 برق يحجب المتعقبات والإعلانات تلقائيًا على مستوى الشبكة — حتى في نتائج البحث</p>

  <script>
    var ENGINES = [
      { id: "google",     name: "جوجل" },
      { id: "bing",       name: "بينج" },
      { id: "duckduckgo", name: "دك دك جو" },
      { id: "yandex",     name: "ياندكس" },
      { id: "wikipedia",  name: "ويكيبيديا" },
      { id: "youtube",    name: "يوتيوب" },
      { id: "x",          name: "إكس (تويتر)" },
      { id: "maps",       name: "خرائط جوجل" }
    ];
    var ENGINE = new URLSearchParams(location.search).get("engine") || "duckduckgo";

    var chips = document.getElementById("chips");
    for (var i = 0; i < ENGINES.length; i++) {
      (function (en) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = en.name;
        if (en.id === ENGINE) b.className = "on";
        b.addEventListener("click", function () {
          location.href = "https://barq.internal/set-engine?e=" + encodeURIComponent(en.id);
        });
        chips.appendChild(b);
      })(ENGINES[i]);
    }

    document.getElementById("s").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("q").value.trim();
      if (!v) return;
      if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(v) && v.indexOf(" ") === -1) {
        location.href = "https://" + v;
      } else {
        location.href = "https://barq.internal/search?e=" + encodeURIComponent(ENGINE) + "&q=" + encodeURIComponent(v);
      }
    });

  </script>
</body>
</html>
