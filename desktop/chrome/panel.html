<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
<title>برق — اللوحة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: #18251f; color: #e7f0ec;
    user-select: none;
  }

  button {
    flex: 0 0 auto; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04);
    color: #a7bdb4; cursor: pointer;
    transition: background .06s, color .06s, border-color .06s, transform .05s;
  }
  button:hover:not(:disabled) { background: rgba(52,211,153,.14); color: #34d399; }
  /* إحساس الضغط: كل زر ينخفض ويغمق لحظة الضغط الفعلية عليه */
  button:active:not(:disabled) {
    transform: translateY(1px) scale(.92);
    background: rgba(52,211,153,.35);
    border-color: rgba(52,211,153,.75);
    color: #eafff6;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.5);
  }
  button:disabled { opacity: .35; cursor: default; }

  /* 1.2.6 — اللوحة صارت نافذة مستقلة فوق الصفحة: كامل ارتفاع هذا العرض */
  .panel {
    height: 100%; display: flex; flex-direction: column; gap: 8px;
    padding: 12px 14px;
    background: #18251f;
    border-right: 1px solid rgba(255,255,255,.18);
    box-shadow: 10px 0 30px rgba(0,0,0,.5);
  }
  /* وضع اللوحة على اليمين: المرآة الكاملة لوضع اليسار */
  body.panel-right .panel {
    border-right: none; border-left: 1px solid rgba(255,255,255,.18);
    box-shadow: -10px 0 30px rgba(0,0,0,.5);
  }
  .panel-head { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .panel-head b { font-size: 15px; color: #3ee0a2; }
  .panel-head .grow { flex: 1; }
  .panel-head button.act {
    width: auto; height: 28px; padding: 0 12px; font-size: 12px; border-radius: 8px;
    font-family: inherit;
  }
  .panel-head button.act:hover { color: #f87171; border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.08); }
  /* زر تبديل جهة اللوحة — بلون مميز حتى يُلاحظ فوراً */
  .panel-head button.act.side { color: #f5b83d; border-color: rgba(245,184,61,.45); }
  .panel-head button.act.side:hover { color: #ffd479; border-color: rgba(245,184,61,.75); background: rgba(245,184,61,.12); }
  .panel-head button.act.close:hover { color: #f87171; border-color: rgba(248,113,113,.6); background: rgba(248,113,113,.14); }
  .plist {
    flex: 1 1 auto; overflow-y: auto;
    border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
    background: rgba(0,0,0,.3);
  }
  .row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,.05);
    transition: background .05s;
  }
  .row:hover { background: rgba(52,211,153,.16); }
  .row:active { background: rgba(52,211,153,.34); }
  .row:last-child { border-bottom: none; }
  .row .main { flex: 1 1 auto; min-width: 0; }
  .row .t1 {
    font-size: 14px; font-weight: 600; color: #ffffff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .t2 {
    font-size: 12px; color: #c3d6cc; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: ltr; text-align: left;
  }
  button:disabled { opacity: .35; cursor: default; }

  /* 1.4.0 — مقبض تغيير عرض اللوحة: شريط رفيع على الحافة الداخلية */
  .resize-handle {
    position: fixed; top: 0; bottom: 0; width: 10px;
    cursor: col-resize; z-index: 99;
  }
  body:not(.panel-right) .resize-handle { right: 0; }
  body.panel-right .resize-handle { left: 0; }
  .resize-handle::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 3px;
    background: rgba(255,255,255,.22);
    transition: background .08s;
  }
  body:not(.panel-right) .resize-handle::after { right: 0; }
  body.panel-right .resize-handle::after { left: 0; }
  .resize-handle:hover::after,
  .resize-handle.dragging::after { background: #34d399; }
  .empty { color: #e2efe9; font-size: 14px; line-height: 1.8; text-align: center; padding: 26px 14px; }
  .empty.err { color: #f8b4b4; }

  /* 1.4.2 — لوحة الحساب: نموذج دخول/إنشاء اختياري (بلا حساب يعمل برق طبيعياً) */
  .acct { padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .acct .hello { font-size: 15px; font-weight: 700; color: #3ee0a2; text-align: center; }
  .acct .note { font-size: 11.5px; color: #8fa39a; line-height: 1.9; text-align: center; }
  .acct label { font-size: 12px; color: #a7bdb4; display: block; }
  .acct input {
    width: 100%; height: 38px; margin-top: 4px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.14); outline: none;
    background: rgba(0,0,0,.35); color: #e7f0ec; padding: 0 12px;
    font-size: 14px; font-family: inherit;
  }
  .acct input:focus { border-color: rgba(52,211,153,.55); box-shadow: 0 0 0 2px rgba(52,211,153,.12); }
  .acct .modes { display: flex; gap: 8px; }
  .acct .modes button { flex: 1; height: 32px; font-family: inherit; font-size: 12.5px; }
  .acct .modes button.sel { background: rgba(52,211,153,.22); color: #34d399; border-color: rgba(52,211,153,.5); }
  .acct .go {
    height: 40px; border-radius: 10px; font-family: inherit;
    font-size: 13.5px; font-weight: 700;
    border: 1px solid rgba(52,211,153,.5); background: rgba(52,211,153,.16); color: #34d399;
  }
  .acct .go:hover:not(:disabled) { background: rgba(52,211,153,.3); }
  .acct .go:disabled { opacity: .5; cursor: default; }
  .acct .msg { min-height: 16px; font-size: 12px; color: #f28b82; text-align: center; }
  .acct .msg.ok { color: #34d399; }
  /* 1.4.3 — الحساب السحابي */
  .acct .divider { display: flex; align-items: center; gap: 8px; color: #57706a; font-size: 11px; }
  .acct .divider::before, .acct .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.08); }
  .acct .cloud-ok {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid rgba(52,211,153,.35); border-radius: 10px; background: rgba(52,211,153,.08);
  }
  .acct .cloud-ok .av {
    width: 34px; height: 34px; border-radius: 50%; background: #34d399; color: #052e21;
    font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .acct .cloud-ok .n { font-weight: 700; font-size: 13px; color: #e8f2ec; }
  .acct .cloud-ok .s { font-size: 10.5px; color: #8fa39a; }
  .acct .tiny { font-size: 10.5px; color: #6f857d; line-height: 1.8; text-align: center; }
  .acct .link { color: #34d399; cursor: pointer; text-decoration: underline; font-size: 11px; }

  /* شريط تمرير رقيق وواضح */
  .plist::-webkit-scrollbar { width: 8px; }
  .plist::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 4px; }
  .plist::-webkit-scrollbar-track { background: transparent; }

  /* 1.4.0 — مقبض تغيير عرض اللوحة: شريط رفيع على الحافة الداخلية */
  .resize-handle {
    position: fixed; top: 0; bottom: 0; width: 10px;
    cursor: col-resize; z-index: 99;
  }
  body:not(.panel-right) .resize-handle { right: 0; }
  body.panel-right .resize-handle { left: 0; }
  .resize-handle::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 3px;
    background: rgba(255,255,255,.22);
    transition: background .08s;
  }
  body:not(.panel-right) .resize-handle::after { right: 0; }
  body.panel-right .resize-handle::after { left: 0; }
  .resize-handle:hover::after,
  .resize-handle.dragging::after { background: #34d399; }
</style>
</head>
<body>
  <div class="panel" role="region" aria-label="لوحة السجل والمفضلة">
    <div class="panel-head">
      <b id="panel-title">🕘 سجل البحث</b>
      <span class="grow"></span>
      <button class="act" id="clear-history" title="حذف كل السجل">مسح الكل</button>
      <button class="act side" id="side-btn" title="انقل اللوحة إلى الجهة الأخرى">إلى اليمين</button>
      <button class="act close" id="close-btn" title="إغلاق اللوحة">✕</button>
    </div>
    <div class="plist" id="list"></div>
  </div>
  <!-- 1.4.0 — مقبض السحب: خارج .panel ليغطي كامل الارتفاع -->
  <div class="resize-handle" id="resize-handle" title="اسحب لتغيير عرض اللوحة" aria-label="تغيير عرض اللوحة"></div>
  <script src="panel.js"></script>
</body>
</html>
