name: Build Desktop Apps

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: Barq-Windows
            artifact_path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          - os: macos-latest
            target: mac
            artifact: Barq-macOS
            artifact_path: |
            desktop/dist/Barq-*.dmg
            desktop/dist/*.yml
            desktop/dist/*.blockmap
          - os: ubuntu-latest
            target: linux
            artifact: Barq-Linux
            artifact_path: |
            desktop/dist/Barq-*.AppImage
            desktop/dist/*.yml
            desktop/dist/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build (${{ matrix.target }})
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  build-win7:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps with Electron 22 (last version supporting Windows 7)
        working-directory: desktop
        run: npm install --no-save electron@22.3.27 --no-audit --no-fund

      - name: Build 32-bit installer for Windows 7
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never --config electron-builder.win7.yml

      - name: Build true portable zip (self-contained data)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never --config electron-builder.portable.yml

      - name: Upload artifacts (installer + portable zip)
        uses: actions/upload-artifact@v4
        with:
          name: Barq-Windows7
          path: |
            desktop/dist/Barq-Setup-win7-*.exe
            desktop/dist/Barq-Setup-win7-*.zip
            desktop/dist/*.yml
            desktop/dist/*.blockmap
            desktop/dist/Barq-Portable-*.zip
          if-no-files-found: error

  release:
    needs: [build, build-win7]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: rel
          merge-multiple: true

      - name: Upload to stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la rel/
          gh release view stable >/dev/null 2>&1 || \
            gh release create stable \
              --title "برق — التنزيلات المستقرة" \
              --notes "أحدث ملفات تنزيل برق لكل المنصات: أندرويد APK · ويندوز EXE · ماك DMG · لينكس AppImage. الروابط الثابتة عبر releases/download/stable/<اسم الملف>."
          gh release upload stable rel/* --clobber
          # تنظيف ملفات قديمة خاطئة من تشغيلات سابقة (مثبّت مزدوج البنية باسم افتراضي)
          gh release view stable --json assets --jq '.assets[].name' \
            | grep -qx 'Barq-Setup-1.0.0.exe' \
            && gh release delete-asset stable 'Barq-Setup-1.0.0.exe' --yes || true
