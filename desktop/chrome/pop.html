<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
<title>برق — قائمة</title>
<link rel="stylesheet" href="theme.css" />
<style>
  /* 1.4.7 — القائمة العائمة: هذا الملف يعرض داخل BrowserView مستقل يرسم فوق الصفحة
     بلا أي إزاحة لها — تُفتح بالطلب فقط، والقائمة النشطة دائماً أعلى طبقة */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--card); color: var(--text);
    user-select: none; padding: 5px;
  }
  .pop {
    height: 100%; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--accline); border-radius: 12px;
    padding: 8px; gap: 2px; overflow: hidden;
  }
  .ph { color: var(--acc); font-weight: 800; font-size: 13px; padding: 2px 4px 4px; flex: 0 0 auto; }
  .psub { color: var(--dim); font-size: 10.5px; padding: 0 4px 6px; line-height: 1.8; flex: 0 0 auto; }
  .pscroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .pscroll::-webkit-scrollbar { width: 8px; }
  .pscroll::-webkit-scrollbar-thumb { background: rgba(128,128,128,.35); border-radius: 4px; }
  .pscroll::-webkit-scrollbar-track { background: transparent; }
  .pnote { color: var(--dim); font-size: 12px; padding: 10px 4px; line-height: 1.9; }
  .psep { height: 1px; background: var(--line); margin: 5px 8px; flex: 0 0 auto; }

  /* قائمة محركات البحث — الصح = يشارك في البحث الشامل، و✓ + «افتراضي» أمام الافتراضي (جوجل) */
  .eng-row {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 9px; border-radius: 9px; cursor: pointer;
    font-size: 13px; color: var(--soft);
  }
  .eng-row:hover { background: var(--hover); }
  .eng-row input {
    width: 15px; height: 15px; accent-color: var(--acc); cursor: pointer; flex: 0 0 auto;
  }
  .eng-row .eng-name { flex: 1; }
  .eng-row.cur .eng-name { color: var(--acc); font-weight: 700; }
  .eng-row.cur .eng-check { color: var(--acc); font-weight: 900; font-size: 13px; }
  .eng-badge {
    display: none; font-size: 10px; color: #fff;
    background: var(--acc); border-radius: 999px; padding: 2px 8px;
  }
  .eng-row.cur .eng-badge { display: inline-block; }
  .eng-row.shake { animation: shake .25s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(3px); }
    75% { transform: translateX(-3px); }
  }

  /* المتعقبات المحجوبة */
  .tpop-sub { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; padding: 0 4px; }
  .trk-row {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 4px 2px; border-bottom: 1px solid var(--line);
    font-size: 12px; direction: ltr;
  }
  .trk-d { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trk-n { color: var(--acc); font-weight: 700; }
  .trk-empty { color: var(--dim); font-size: 12px; padding: 8px 2px; line-height: 1.9; }
  .tpop-note {
    color: var(--dim); font-size: 10.5px; margin-top: 8px;
    border-top: 1px solid var(--line); padding: 6px 4px 0; flex: 0 0 auto;
  }

  /* التنزيلات */
  .drow { border-bottom: 1px solid var(--line); padding: 7px 2px; }
  .drow:last-child { border-bottom: none; }
  .drow-t { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .drow-f {
    color: var(--text); font-size: 12.5px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr;
  }
  .drow-s { color: var(--muted); font-size: 11px; white-space: nowrap; flex-shrink: 0; }
  .dbar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .dbar > i { display: block; height: 100%; background: var(--acc); border-radius: 4px; transition: width .2s linear; }
  .drow-a { display: flex; gap: 6px; margin-top: 7px; }
  .dbtn {
    height: 24px; padding: 0 10px; border-radius: 8px; cursor: pointer;
    font-size: 11px; font-family: inherit;
    border: 1px solid var(--accline); background: var(--accbg); color: var(--acc);
  }
  .dbtn:hover { filter: brightness(1.1); }
  .dempty { color: var(--dim); font-size: 12px; padding: 8px 2px; line-height: 1.9; }
  .dfoot { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; text-align: left; flex: 0 0 auto; }

  /* قائمة الإعدادات والمزيد */
  .mrow {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border-radius: 9px; cursor: pointer;
    font-size: 13px; color: var(--soft); background: none; border: none;
    text-align: right; font-family: inherit;
  }
  .mrow:hover:not(:disabled) { background: var(--hover); color: var(--acc); }
  .mrow:disabled { opacity: .4; cursor: default; }
  .mrow .mi { width: 17px; text-align: center; flex-shrink: 0; }
  .mrow .mk {
    margin-inline-start: auto; color: var(--dim); font-size: 10.5px;
    direction: ltr; font-family: Consolas, monospace;
  }
  .mrow.zoom-label { cursor: default; }
  .mrow.zoom-label:hover { background: none; color: var(--soft); }
  .mrow.zoom-label .zoom-pct { color: var(--acc); font-weight: 800; margin-inline-start: auto; font-size: 12px; direction: ltr; }
  .mfoot {
    color: var(--dim); font-size: 10.5px; text-align: center;
    padding: 7px 8px 3px; direction: ltr; font-family: Consolas, monospace; flex: 0 0 auto;
  }

  /* الإضافات */
  .ext-row {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 9px; border-radius: 9px; font-size: 12.5px; color: var(--soft);
    border-bottom: 1px solid var(--line);
  }
  .ext-row .en { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ext-row .ev { color: var(--dim); font-size: 10.5px; direction: ltr; }
  .ext-load {
    width: 100%; margin-top: 8px; height: 34px; border-radius: 10px; cursor: pointer;
    font-size: 12.5px; font-weight: 700; font-family: inherit;
    border: 1px solid var(--accline); background: var(--accbg); color: var(--acc);
  }
  .ext-load:hover { filter: brightness(1.1); }
  .ext-msg { color: var(--danger); font-size: 11px; padding: 6px 4px 0; line-height: 1.8; }
  .ext-msg.ok { color: var(--acc); }

  /* سجل رجوع/تقدم */
  .hrow {
    display: flex; flex-direction: column; gap: 1px;
    padding: 7px 9px; border-radius: 9px; cursor: pointer;
  }
  .hrow:hover { background: var(--hover); }
  .hrow .t { font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .u { font-size: 10.5px; color: var(--dim); direction: ltr; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div class="pop" id="pop" role="menu"></div>
  <script src="pop.js"></script>
</body>
</html>
